name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q handrefill*.zip -d src_unzipped
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: src_unzipped/handrefill
      - uses: actions/upload-artifact@v4
        with:
          name: handrefill-jar
          path: src_unzipped/handrefill/build/libs/handrefill-1.0.0.jar
